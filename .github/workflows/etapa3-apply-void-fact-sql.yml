name: Apply Etapa 3 void_fact SQL fix

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Apply targeted SQL whitelist patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/record_corrections.rs')
          text = path.read_text()
          function_start = text.index('async fn void_fact(')
          start_marker = '    let current_void: Option<String> =\n'
          end_marker = '    let after = snapshot_tx(&mut tx, snapshot_sql, &id, "Registro não encontrado.").await?;\n'
          start = text.index(start_marker, function_start)
          end = text.index(end_marker, start)
          new = '''    let (current_void_sql, void_sql) = match table {
              "inspections" => (
                  "SELECT voided_at FROM inspections WHERE id=?",
                  "UPDATE inspections SET voided_at=?, void_reason=? WHERE id=?",
              ),
              "feedings" => (
                  "SELECT voided_at FROM feedings WHERE id=?",
                  "UPDATE feedings SET voided_at=?, void_reason=? WHERE id=?",
              ),
              "production_records" => (
                  "SELECT voided_at FROM production_records WHERE id=?",
                  "UPDATE production_records SET voided_at=?, void_reason=? WHERE id=?",
              ),
              "box_maintenance_records" => (
                  "SELECT voided_at FROM box_maintenance_records WHERE id=?",
                  "UPDATE box_maintenance_records SET voided_at=?, void_reason=? WHERE id=?",
              ),
              "colony_events" => (
                  "SELECT voided_at FROM colony_events WHERE id=?",
                  "UPDATE colony_events SET voided_at=?, void_reason=? WHERE id=?",
              ),
              "colony_movements" => (
                  "SELECT voided_at FROM colony_movements WHERE id=?",
                  "UPDATE colony_movements SET voided_at=?, void_reason=? WHERE id=?",
              ),
              "movement_documents" => (
                  "SELECT voided_at FROM movement_documents WHERE id=?",
                  "UPDATE movement_documents SET voided_at=?, void_reason=? WHERE id=?",
              ),
              _ => {
                  return Err(AppError::Validation(
                      "Tipo de registro inválido para anulação.".to_owned(),
                  ))
              }
          };
          let current_void: Option<String> = sqlx::query_scalar(current_void_sql)
              .bind(&id)
              .fetch_one(&mut *tx)
              .await?;
          if current_void.is_some() {
              return Err(AppError::Validation(
                  "O registro já está anulado.".to_owned(),
              ));
          }
          let voided_at = now_tx(&mut tx).await?;
          sqlx::query(void_sql)
              .bind(voided_at)
              .bind(&reason)
              .bind(&id)
              .execute(&mut *tx)
              .await?;
          '''
          path.write_text(text[:start] + new + text[end:])
          Path('.github/workflows/etapa3-apply-void-fact-sql.yml').unlink()
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          git diff -- src-tauri/src/record_corrections.rs

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/record_corrections.rs .github/workflows/etapa3-apply-void-fact-sql.yml
          git commit -m "fix: whitelist void record sql queries"
          git push origin HEAD:feat/v0.8-operational-actions
