name: Apply Etapa 3 rustfmt run 144

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Download official rustfmt artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9699124819/zip" -o /tmp/rustfmt.zip
          mkdir -p /tmp/rustfmt
          unzip -q /tmp/rustfmt.zip -d /tmp/rustfmt
          test -f /tmp/rustfmt/migration_tests.rs

      - name: Apply exact formatted migration test source
        shell: bash
        run: |
          cp /tmp/rustfmt/migration_tests.rs src-tauri/src/migration_tests.rs
          rm .github/workflows/etapa3-apply-rustfmt144.yml
          git diff --check
          git diff -- src-tauri/src/migration_tests.rs

      - name: Commit official formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/migration_tests.rs .github/workflows/etapa3-apply-rustfmt144.yml
          git commit -m "style: apply official rustfmt from run 144"
          git push origin HEAD:feat/v0.8-operational-actions
