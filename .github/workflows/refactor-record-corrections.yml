name: One-shot record corrections decomposition

on:
  push:
    branches:
      - refactor/technical-debt
    paths:
      - .github/workflows/refactor-record-corrections.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5446ce83e2 # v7
        with:
          ref: refactor/technical-debt
          persist-credentials: false

      - name: Split record correction responsibilities
        run: |
          python3 scripts/refactor-record-corrections.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit decomposition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/refactor-record-corrections.yml scripts/refactor-record-corrections.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(rust): split record correction responsibilities"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refactor/technical-debt
