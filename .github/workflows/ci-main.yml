name: Main validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Validate version metadata
        run: npm run version:check

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run icons

      - name: Validate bundle icons
        run: npm run bundle:check

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm run test:ui

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Tauri desktop binary
        run: npm run tauri -- build --no-bundle

      - name: Smoke test desktop startup
        shell: bash
        run: |
          set +e
          timeout 8s xvfb-run -a src-tauri/target/release/meliponariomanager
          status=$?
          set -e

          if [ "$status" -eq 124 ]; then
            echo "Desktop application remained alive for the smoke-test window."
            exit 0
          fi

          echo "::error::Desktop application exited unexpectedly during startup smoke test (status $status)."
          exit 1
