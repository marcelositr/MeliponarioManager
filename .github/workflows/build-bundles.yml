name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.1

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v0.')
        run: npm run version:check -- --tag "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate platform icons
        run: npm run icons

      - name: Validate bundle icons
        run: npm run bundle:check

      - name: Load release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v0.')
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing release notes: $notes_file"
            exit 1
          fi
          {
            echo 'body<<__RELEASE_NOTES__'
            cat "$notes_file"
            echo '__RELEASE_NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Build bundles for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Build and attach draft release
        if: startsWith(github.ref, 'refs/tags/v0.')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MeliponarioManager ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}

      - name: Upload generated bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MeliponarioManager-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
