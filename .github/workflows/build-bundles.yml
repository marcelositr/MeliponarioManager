name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v0.')
        run: npm run version:check -- --tag "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm install

      - name: Generate platform icons
        run: npm run icons

      - name: Validate bundle icons
        run: npm run bundle:check

      - name: Load release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v0.')
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing release notes: $notes_file"
            exit 1
          fi
          {
            echo 'body<<__RELEASE_NOTES__'
            cat "$notes_file"
            echo '__RELEASE_NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Build bundles for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Build and attach draft release
        if: startsWith(github.ref, 'refs/tags/v0.')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MeliponarioManager ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}

      - name: Upload generated bundles
        uses: actions/upload-artifact@v4
        with:
          name: MeliponarioManager-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
