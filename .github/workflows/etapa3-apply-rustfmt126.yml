name: Apply Etapa 3 rustfmt run 126

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Download official rustfmt artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rustfmt126
          gh run download 33201151260 --repo marcelositr/MeliponarioManager --name rustfmt-etapa3 --dir /tmp/rustfmt126
          test -f /tmp/rustfmt126/record_corrections.rs

      - name: Apply exact formatted source
        run: |
          cp /tmp/rustfmt126/record_corrections.rs src-tauri/src/record_corrections.rs
          rm .github/workflows/etapa3-apply-rustfmt126.yml
          git diff --check
          git diff --stat

      - name: Commit official formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/record_corrections.rs .github/workflows/etapa3-apply-rustfmt126.yml
          git commit -m "style: apply official rustfmt from run 126"
          git push origin HEAD:feat/v0.8-operational-actions
