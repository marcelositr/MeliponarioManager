name: Apply Etapa 3 migration count SQL fix

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Apply focused static SQL patch
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('src-tauri/src/migration_tests.rs'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1)); Path('.github/workflows/etapa3-fix-migration-count-sql.yml').unlink()"
          git diff --check
          git diff -- src-tauri/src/migration_tests.rs

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/migration_tests.rs .github/workflows/etapa3-fix-migration-count-sql.yml
          git commit -m "fix: use static SQL in migration data checks"
          git push origin HEAD:feat/v0.8-operational-actions
