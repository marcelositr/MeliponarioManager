name: One-shot reports view extraction

on:
  push:
    branches:
      - fix/post-audit-cleanup
    paths:
      - ".github/workflows/refactor-reports-view.yml"

permissions:
  contents: write

jobs:
  extract-report-views:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-cleanup
          fetch-depth: 0

      - name: Extract report view components
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/pages/ReportsPage.tsx")
          destination = Path("src/pages/reports/ReportViews.tsx")
          text = source.read_text(encoding="utf-8")
          marker = "\nfunction ReportHeader"
          if text.count(marker) != 1:
              raise SystemExit("ReportsPage.tsx: expected one ReportHeader boundary")

          controller, views = text.split(marker, 1)
          views = "function ReportHeader" + views
          for name in ["OperationalView", "ProductionView", "CostView", "AgendaView", "ColonyView", "MeliponaryView"]:
              needle = f"function {name}"
              if needle not in views:
                  raise SystemExit(f"missing {name}")
              views = views.replace(needle, f"export function {name}", 1)

          view_imports = "\n".join([
              'import { formatDateTimeBr } from "../../lib/presentation";',
              'import { formatBrl, formatReportNumber } from "../../lib/report-presentation";',
              'import type {',
              '  AgendaMetrics,',
              '  AgendaReport,',
              '  ColonyReport,',
              '  CostReport,',
              '  MeliponaryReport,',
              '  OperationalReport,',
              '  ProductionAggregate,',
              '  ProductionReport,',
              '  ReportContext,',
              '} from "../../lib/reports-api";',
              '',
              '',
          ])
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(view_imports + views.rstrip() + "\n", encoding="utf-8")

          import_line = 'import { AgendaView, ColonyView, CostView, MeliponaryView, OperationalView, ProductionView } from "./reports/ReportViews";\n'
          anchor = 'import type { Colony, Meliponary, Species } from "../types";\n'
          if anchor not in controller:
              raise SystemExit("ReportsPage.tsx: import anchor not found")
          controller = controller.replace(anchor, anchor + import_line, 1)
          source.write_text(controller.rstrip() + "\n", encoding="utf-8")

          Path(".github/workflows/refactor-reports-view.yml").unlink()

      - name: Commit report view module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: separate report rendering views"
          git push origin HEAD:fix/post-audit-cleanup
