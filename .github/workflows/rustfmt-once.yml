name: One-shot Rust formatting

on:
  push:
    branches:
      - fix/post-audit-cleanup
    paths:
      - ".github/workflows/rustfmt-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-cleanup
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/rustfmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format extracted Rust tests"
          git push origin HEAD:fix/post-audit-cleanup
