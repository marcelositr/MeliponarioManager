name: Apply Etapa 3 timeline movement row type fix

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Factor only timeline movement row type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/timeline.rs")
          text = path.read_text()
          old = '            let s:Option<(Option<String>,Option<String>,Option<String>,Option<String>,Option<String>)>=sqlx::query_as("SELECT corrected_at,voided_at,void_reason,reversed_at,reversal_reason FROM colony_movements WHERE id=?").bind(&e.source_id).fetch_optional(p).await?;\n'
          new = '            type MovementDecorationRow = (\n                Option<String>,\n                Option<String>,\n                Option<String>,\n                Option<String>,\n                Option<String>,\n            );\n            let s: Option<MovementDecorationRow> = sqlx::query_as("SELECT corrected_at,voided_at,void_reason,reversed_at,reversal_reason FROM colony_movements WHERE id=?").bind(&e.source_id).fetch_optional(p).await?;\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one timeline movement row declaration, found {count}")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/etapa3-fix-timeline-movement-row-type.yml").unlink()
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check
          git diff -- src-tauri/src/timeline.rs

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/timeline.rs .github/workflows/etapa3-fix-timeline-movement-row-type.yml
          git commit -m "refactor: name timeline movement query row"
          git push origin HEAD:feat/v0.8-operational-actions
