name: Apply Etapa 3 reversal match fix

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Patch exactly one match arm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/reversals.rs")
          s = p.read_text()
          needle = ".execute(&mut *tx)\n                .await?\n        }\n        _ => {"
          replacement = ".execute(&mut *tx)\n                .await?;\n        }\n        _ => {"
          if s.count(needle) != 1:
              raise SystemExit(f"target count: {s.count(needle)}")
          p.write_text(s.replace(needle, replacement, 1))
          Path(".github/workflows/etapa3-fix-reversal-match.yml").unlink()
          PY
          git diff --check
          git diff -- src-tauri/src/reversals.rs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/reversals.rs .github/workflows/etapa3-fix-reversal-match.yml
          git commit -m "fix: normalize lifecycle reversal match arm"
          git push origin HEAD:feat/v0.8-operational-actions
