name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
    paths-ignore:
      - ".github/POST-AUDIT-ACTION-PLAN.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect documentation-only change
        id: change_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              README.md|CONTRIBUTING.md|SECURITY.md|CHANGELOG.md|docs/*.md|wiki/*.md|.github/POST-AUDIT-ACTION-PLAN.md)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Validate version metadata
        run: npm run version:check

      - name: Validate documentation links
        run: npm run docs:check

      - name: Install system dependencies
        if: steps.change_scope.outputs.code_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        if: steps.change_scope.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Cache Rust build
        if: steps.change_scope.outputs.code_changed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        if: steps.change_scope.outputs.code_changed == 'true'
        run: npm ci

      - name: Generate desktop icons
        if: steps.change_scope.outputs.code_changed == 'true'
        run: npm run icons

      - name: Validate bundle icon configuration
        if: steps.change_scope.outputs.code_changed == 'true'
        run: npm run bundle:check

      - name: Build frontend
        if: steps.change_scope.outputs.code_changed == 'true'
        run: npm run build

      - name: Test frontend
        if: steps.change_scope.outputs.code_changed == 'true'
        run: npm run test:ui

      - name: Check Rust formatting
        if: steps.change_scope.outputs.code_changed == 'true'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust backend
        if: steps.change_scope.outputs.code_changed == 'true'
        working-directory: src-tauri
        run: cargo check --locked

      - name: Clippy
        if: steps.change_scope.outputs.code_changed == 'true'
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust backend
        if: steps.change_scope.outputs.code_changed == 'true'
        working-directory: src-tauri
        run: cargo test --locked
