name: Fix Clippy findings

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply exact Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          documents = Path("src-tauri/src/documents.rs")
          text = documents.read_text()
          old = "use crate::{movements, repository::AppError};"
          new = "use crate::repository::AppError;"
          if old not in text:
              raise SystemExit("expected documents.rs import not found")
          documents.write_text(text.replace(old, new, 1))

          data_management = Path("src-tauri/src/data_management.rs")
          text = data_management.read_text()
          old = 'if integrity.to_ascii_lowercase() != "ok" {'
          new = 'if !integrity.eq_ignore_ascii_case("ok") {'
          if old not in text:
              raise SystemExit("expected integrity comparison not found")
          data_management.write_text(text.replace(old, new, 1))

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/documents.rs src-tauri/src/data_management.rs
          git commit -m "fix: resolve Clippy warnings"
          git push origin HEAD:${{ github.head_ref }}
