name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Validate version metadata
        run: npm run version:check

      - name: Install frontend dependencies
        run: npm install

      - name: Generate desktop icons
        run: npm run icons

      - name: Validate bundle icons
        run: npm run bundle:check

      - name: Build frontend
        run: npm run build

      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Upload rustfmt output
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: src-tauri/src
          if-no-files-found: error

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri desktop binary
        run: npm run tauri -- build --no-bundle
