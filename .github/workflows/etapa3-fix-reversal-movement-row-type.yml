name: Apply Etapa 3 movement row type fix

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Factor only movement reversal row type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/reversals.rs")
          text = path.read_text()
          old = '    let row:Option<(String,String,String,String,Option<String>,Option<String>,Option<String>,Option<String>)>=sqlx::query_as("SELECT colony_id,movement_type,moved_at,from_meliponary_id,to_meliponary_id,from_box_id,to_box_id,reversed_at FROM colony_movements WHERE id=? AND voided_at IS NULL").bind(&id).fetch_optional(p).await?;\n'
          new = '    type MovementReversalRow = (\n        String,\n        String,\n        String,\n        String,\n        Option<String>,\n        Option<String>,\n        Option<String>,\n        Option<String>,\n    );\n    let row: Option<MovementReversalRow> = sqlx::query_as("SELECT colony_id,movement_type,moved_at,from_meliponary_id,to_meliponary_id,from_box_id,to_box_id,reversed_at FROM colony_movements WHERE id=? AND voided_at IS NULL").bind(&id).fetch_optional(p).await?;\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one movement row declaration, found {count}")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/etapa3-fix-reversal-movement-row-type.yml").unlink()
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check
          git diff -- src-tauri/src/reversals.rs

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/reversals.rs .github/workflows/etapa3-fix-reversal-movement-row-type.yml
          git commit -m "refactor: name movement reversal query row"
          git push origin HEAD:feat/v0.8-operational-actions
