name: Format Etapa 4 backend

on:
  push:
    branches: [feat/v0.8-agenda-record-centers]
    paths: [.github/workflows/etapa4-format-backend.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.8-agenda-record-centers
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt
      - name: Tighten Agenda summary and row type
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/agenda.rs')
          text = path.read_text()
          text = text.replace(
              "           SUM(CASE WHEN status='pending' AND scheduled_for < ? THEN 1 ELSE 0 END) overdue,\n"
              "           SUM(CASE WHEN status='pending' AND substr(scheduled_for,1,10)=? THEN 1 ELSE 0 END) today,\n"
              "           SUM(CASE WHEN status='pending' AND scheduled_for >= ? AND scheduled_for <= ? THEN 1 ELSE 0 END) next_seven_days,\n"
              "           SUM(CASE WHEN status='pending' AND scheduled_for > ? THEN 1 ELSE 0 END) future\n",
              "           COALESCE(SUM(CASE WHEN status='pending' AND scheduled_for < ? THEN 1 ELSE 0 END),0) overdue,\n"
              "           COALESCE(SUM(CASE WHEN status='pending' AND substr(scheduled_for,1,10)=? THEN 1 ELSE 0 END),0) today,\n"
              "           COALESCE(SUM(CASE WHEN status='pending' AND scheduled_for >= ? AND scheduled_for <= ? THEN 1 ELSE 0 END),0) next_seven_days,\n"
              "           COALESCE(SUM(CASE WHEN status='pending' AND scheduled_for > ? THEN 1 ELSE 0 END),0) future\n",
              1,
          )
          old = "    let current: Option<(String, String, Option<String>, Option<String>, String, String, Option<String>, String, Option<String>, Option<String>)> = sqlx::query_as(\n"
          new = "    type RescheduleRow = (\n        String,\n        String,\n        Option<String>,\n        Option<String>,\n        String,\n        String,\n        Option<String>,\n        String,\n        Option<String>,\n        Option<String>,\n    );\n    let current: Option<RescheduleRow> = sqlx::query_as(\n"
          if old not in text:
              raise SystemExit('reschedule tuple anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cd src-tauri
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          git diff --check
      - name: Commit formatted backend
        run: |
          git rm .github/workflows/etapa4-format-backend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src
          git commit -m 'chore: format and tighten etapa 4 backend'
          git push origin HEAD:feat/v0.8-agenda-record-centers
