name: Apply Etapa 3 void_fact static lifetime fix

on:
  push:
    branches:
      - feat/v0.8-operational-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: feat/v0.8-operational-actions
          fetch-depth: 0

      - name: Apply one-line lifetime fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/record_corrections.rs')
          text = path.read_text()
          old = '    snapshot_sql: &str,\n'
          new = "    snapshot_sql: &'static str,\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target signature, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/etapa3-fix-void-fact-static.yml').unlink()
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --numstat -- src-tauri/src/record_corrections.rs | awk '{print $1+$2}')" = "2"
          git diff -- src-tauri/src/record_corrections.rs

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/record_corrections.rs .github/workflows/etapa3-fix-void-fact-static.yml
          git commit -m "fix: require static snapshot sql for void facts"
          git push origin HEAD:feat/v0.8-operational-actions
