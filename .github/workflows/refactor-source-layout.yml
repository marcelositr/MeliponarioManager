name: One-shot Rust test extraction

on:
  push:
    branches:
      - fix/post-audit-cleanup
    paths:
      - ".github/workflows/refactor-source-layout.yml"

permissions:
  contents: write

jobs:
  extract-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-cleanup
          fetch-depth: 0

      - name: Extract inline Rust test modules
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          targets = [
              (Path("src-tauri/src/agenda.rs"), Path("src-tauri/src/agenda/tests.rs")),
              (Path("src-tauri/src/data_management.rs"), Path("src-tauri/src/data_management/tests.rs")),
              (Path("src-tauri/src/record_corrections.rs"), Path("src-tauri/src/record_corrections/tests.rs")),
          ]
          marker = "#[cfg(test)]\nmod tests {\n"

          for source, destination in targets:
              text = source.read_text(encoding="utf-8")
              if text.count(marker) != 1:
                  raise SystemExit(f"{source}: expected exactly one inline test module")

              prefix, nested = text.split(marker, 1)
              nested = nested.rstrip()
              if not nested.endswith("}"):
                  raise SystemExit(f"{source}: inline test module is not the final block")

              body = textwrap.dedent(nested[:-1]).strip("\n") + "\n"
              if not body.startswith("use super::*;"):
                  raise SystemExit(f"{source}: unexpected test module body")

              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(body, encoding="utf-8")
              source.write_text(
                  prefix.rstrip() + "\n\n#[cfg(test)]\nmod tests;\n",
                  encoding="utf-8",
              )

          Path(".github/workflows/refactor-source-layout.yml").unlink()

      - name: Commit extracted test modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: extract large inline Rust test modules"
          git push origin HEAD:fix/post-audit-cleanup
