[package]
name = "meliponario-manager"
version = "0.1.0"
description = "Desktop manager for meliponaries"
authors = ["Marcelo Trindade"]
edition = "2021"

[lib]
name = "meliponario_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tauri = { version = "2", features = [] }
thiserror = "2"
